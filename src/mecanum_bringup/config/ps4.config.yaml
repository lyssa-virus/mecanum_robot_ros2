teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 5

    axis_linear:
      x: 1
      y: 0
      z: -1

    scale_linear:
      x: 1.0
      y: 1.0
      z: 0.0

    axis_angular:
      yaw: 3
      pitch: -1
      roll: -1

    scale_angular:
      yaw: 3.2
      pitch: 0.0
      roll: 0.0
